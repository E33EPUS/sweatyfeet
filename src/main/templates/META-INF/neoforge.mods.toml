modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# 泡脚动画（必装）：没装 player-animator 客户端直接拒绝加载（动画是核心观感）
[[dependencies.${mod_id}]]
    modId="playeranimator"
    type="required"
    versionRange="[2.0.4,)"
    ordering="AFTER"
    side="CLIENT"

# 手册（optional）：装了帕秋莉进世界发手册，没装其余功能正常
[[dependencies.${mod_id}]]
    modId="patchouli"
    type="optional"
    versionRange="[1.21.1-92,)"
    ordering="AFTER"
    side="BOTH"
